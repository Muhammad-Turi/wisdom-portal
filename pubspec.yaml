name: wisdom_portal_1
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_auth: ^6.7.0
  window_manager: ^0.5.2
  connectivity_plus: ^7.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4


flutter:
  uses-material-design: true

  assets:
    - lib/assets/images/

flutter_launcher_icons:
  image_path: "lib/assets/images/school_logo.png"
  android: true
  ios: true
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "lib/assets/images/school_logo.png"
  windows:
    generate: true
    image_path: "lib/assets/images/school_logo.png"
    icon_size: 256
flutter_native_splash:
  color: "#ffffff"
  image: lib/assets/images/school_logo.png
  android_12:
    color: "#ffffff"
    image: lib/assets/images/school_logo.png  